name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # heap and stack for the JVM
      SBT_OPTS: -Xms1G -Xmx4G -Xss8M
      # enables deeper recursion
      JAVA_TOOL_OPTIONS: -Xss8M
      LC_NUMERIC: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          z3 --version

      - name: Compile
        run: sbt -v -batch compile Test/compile

      - name: Test
        run: sbt -v -batch test
